{
	appId: "com.reaxes.chataio",
	productName: "ChatAIO",
	icon: "statics/icons/app-icon",
	directories: {
		output : "__Bin"
	},
	# 正式发 GitHub 的文件名。本地 `yarn build:electron` 由 scripts/electron.build 用 -c.artifactName 改成带 b{count}.{hash}。
	# 设计：docs/architecture/app-version-identity.md
	artifactName: "${productName}-${version}-${os}-${arch}.${ext}",
	electronUpdaterCompatibility: ">=2.16",
	publish: {
		provider: "github",
		owner: "Kane-Kuroneko",
		repo: "ChatAIO-Releases",
	},
	files: ["dist/"],
	extraResources: [
		{
			from: "statics",
			to: "statics",
			filter: [
				"**/*",
				"!icons/main-icon-900x900.png",
				"!icons/main-icon-900x900-dev.png",
			],
		}
	],
	electronVersion: "41.10.2",
	asar: true,

	mac: {
		target: [
			{
				target: "dmg",
				arch: ["x64", "arm64"]
			},
			{
				target: "zip",
				arch: ["x64", "arm64"]
			}
		],
		category: "public.app-category.productivity",
	},

	win: {
		target: [
			{
				target: "nsis",
				arch: ["x64"]
			}
		],
	},

	linux: {
		target: [
			{
				target: "AppImage",
				arch: ["x64"]
			}
		],
	},
}
